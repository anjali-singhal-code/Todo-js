<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=edit_square" />
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="outer-container">
    <div id="container">
      <div id="heading-container">
        <h2 id="todo-heading">To-Do Lists</h2>
        <img id="todo-logo" src=".././images/todo3.png" alt="">
      </div>
      <div id="input-container">
        <input id="text-input" type="text" placeholder="Enter your task" autocomplete="off">
        <input id="date-input" type="date">
        <button id="button-add">Add</button>
      </div>
        <p id="task-list"></p>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
